<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pictures</title>
<link href="/desktop/assets/fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --accent: #4cd964;
    --text: #ffffff;
    --muted: rgba(255,255,255,.55);
    --dim: rgba(255,255,255,.35);
    --border: rgba(255,255,255,.1);
    --bar: rgba(22,23,28,.72);
    --btn: rgba(255,255,255,.08);
    --btn-hover: rgba(255,255,255,.18);
    --spring: cubic-bezier(0.16,1,0.3,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100vh; overflow: hidden; }
  body { font-family: 'Poppins', sans-serif; color: var(--text); background: #0b0c0f;
    -webkit-font-smoothing: antialiased; user-select: none; display: flex; flex-direction: column; }
  .material-symbols-outlined { font-variation-settings: 'wght' 400; }

  .topbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bar);
    backdrop-filter: blur(30px); border-bottom: 1px solid var(--border); flex: 0 0 auto; }
  .title { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .title b { color: var(--text); font-weight: 600; }
  .ib { width: 34px; height: 34px; border: 0; border-radius: 9px; background: transparent; color: rgba(255,255,255,.8);
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s, color .15s; }
  .ib:hover { background: var(--btn-hover); color: #fff; }
  .ib:disabled { opacity: .3; cursor: default; background: transparent; }
  .ib .material-symbols-outlined { font-size: 20px; }
  .zoom-label { min-width: 46px; text-align: center; font-size: 12px; color: var(--muted); }
  .sep { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }

  .stage { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex;
    align-items: center; justify-content: center; }
  .stage img { position: absolute; max-width: none; transform-origin: center center;
    transition: transform .12s var(--spring); -webkit-user-drag: none; }
  .stage.panning img { transition: none; cursor: grabbing; }
  .stage.zoomed img { cursor: grab; }

  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border: 0;
    border-radius: 50%; background: rgba(0,0,0,.5); backdrop-filter: blur(10px); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; z-index: 3; transition: background .15s; }
  .nav:hover { background: rgba(0,0,0,.75); }
  .nav.prev { left: 14px; } .nav.next { right: 14px; }
  .nav[hidden] { display: none; }

  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; color: var(--dim); text-align: center; padding: 24px; }
  .empty .material-symbols-outlined { font-size: 72px; color: rgba(76,217,100,.5); }
  .empty h2 { font-size: 16px; font-weight: 600; color: var(--muted); }
  .empty p { font-size: 13px; max-width: 340px; line-height: 1.5; }
  .open-btn { margin-top: 4px; display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border: 0;
    border-radius: 11px; background: var(--accent); color: #06230d; font: 600 13px 'Poppins', sans-serif; cursor: pointer; }
  .open-btn:hover { filter: brightness(1.08); }

  .filmstrip { flex: 0 0 auto; display: none; gap: 8px; padding: 8px 12px; overflow-x: auto;
    background: var(--bar); border-top: 1px solid var(--border); }
  .filmstrip.show { display: flex; }
  .thumb { flex: 0 0 auto; width: 54px; height: 40px; border-radius: 7px; overflow: hidden; cursor: pointer;
    border: 2px solid transparent; background: #000; }
  .thumb.active { border-color: var(--accent); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }

  .drophint { position: absolute; inset: 10px; border: 2px dashed var(--accent); border-radius: 16px;
    display: none; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;
    color: var(--accent); background: rgba(76,217,100,.08); z-index: 5; pointer-events: none; }
  body.dragging .drophint { display: flex; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="title" id="title">Pictures</span>
    <button class="ib" id="btnZoomOut" title="Zoom out"><span class="material-symbols-outlined">remove</span></button>
    <span class="zoom-label" id="zoomLabel">100%</span>
    <button class="ib" id="btnZoomIn" title="Zoom in"><span class="material-symbols-outlined">add</span></button>
    <button class="ib" id="btnFit" title="Fit to window"><span class="material-symbols-outlined">fit_screen</span></button>
    <span class="sep"></span>
    <button class="ib" id="btnRotate" title="Rotate"><span class="material-symbols-outlined">rotate_right</span></button>
    <button class="ib" id="btnDownload" title="Download"><span class="material-symbols-outlined">download</span></button>
    <span class="sep"></span>
    <button class="ib" id="btnOpen" title="Open image(s)"><span class="material-symbols-outlined">folder_open</span></button>
  </div>

  <div class="stage" id="stage">
    <button class="nav prev" id="navPrev" hidden><span class="material-symbols-outlined">chevron_left</span></button>
    <button class="nav next" id="navNext" hidden><span class="material-symbols-outlined">chevron_right</span></button>
    <div class="empty" id="empty">
      <span class="material-symbols-outlined">image</span>
      <h2>No image open</h2>
      <p>Open a picture to view it, or drag an image anywhere into this window.</p>
      <button class="open-btn" id="emptyOpen"><span class="material-symbols-outlined" style="font-size:18px;">folder_open</span> Open image</button>
    </div>
    <div class="drophint">Drop to open</div>
  </div>

  <div class="filmstrip" id="filmstrip"></div>

  <input type="file" id="fileInput" accept="image/*" multiple hidden>

<script>
  "use strict";
  const $ = id => document.getElementById(id);
  const stage = $('stage'), empty = $('empty'), filmstrip = $('filmstrip'), fileInput = $('fileInput');
  let items = [];          // { url, name }
  let index = -1;
  let imgEl = null;
  let scale = 1, rotation = 0, fitScale = 1;
  let panX = 0, panY = 0;

  function revokeAll() { items.forEach(it => { try { URL.revokeObjectURL(it.url); } catch (e) {} }); }

  function loadFiles(fileList) {
    const files = [...fileList].filter(f => f.type.startsWith('image/'));
    if (!files.length) return;
    revokeAll();
    items = files.map(f => ({ url: URL.createObjectURL(f), name: f.name }));
    index = 0;
    buildFilmstrip();
    show(0);
  }

  function buildFilmstrip() {
    filmstrip.replaceChildren();
    if (items.length < 2) { filmstrip.classList.remove('show'); return; }
    items.forEach((it, i) => {
      const t = document.createElement('div');
      t.className = 'thumb' + (i === index ? ' active' : '');
      const im = document.createElement('img'); im.src = it.url; im.alt = '';
      t.appendChild(im);
      t.addEventListener('click', () => show(i));
      filmstrip.appendChild(t);
    });
    filmstrip.classList.add('show');
  }

  function show(i) {
    if (i < 0 || i >= items.length) return;
    index = i;
    empty.style.display = 'none';
    if (imgEl) imgEl.remove();
    imgEl = document.createElement('img');
    imgEl.alt = '';
    imgEl.addEventListener('load', () => { fitToWindow(); });
    imgEl.src = items[i].url;
    stage.appendChild(imgEl);
    rotation = 0;
    const it = items[i];
    $('title').textContent = '';
    const b = document.createElement('b'); b.textContent = it.name;
    $('title').append(b, document.createTextNode(items.length > 1 ? `  ·  ${i + 1} of ${items.length}` : ''));
    $('navPrev').hidden = items.length < 2;
    $('navNext').hidden = items.length < 2;
    [...filmstrip.children].forEach((t, ti) => t.classList.toggle('active', ti === index));
    updateButtons();
  }

  function fitToWindow() {
    if (!imgEl || !imgEl.naturalWidth) return;
    const rot = rotation % 180 !== 0;
    const w = rot ? imgEl.naturalHeight : imgEl.naturalWidth;
    const h = rot ? imgEl.naturalWidth : imgEl.naturalHeight;
    const aw = stage.clientWidth - 32, ah = stage.clientHeight - 32;
    fitScale = Math.min(aw / w, ah / h, 1) || 1;
    scale = fitScale;
    panX = 0; panY = 0;
    applyTransform();
  }

  function applyTransform() {
    if (!imgEl) return;
    imgEl.style.transform = `translate(${panX}px, ${panY}px) rotate(${rotation}deg) scale(${scale})`;
    $('zoomLabel').textContent = Math.round(scale / (fitScale || 1) * 100) + '%';
    stage.classList.toggle('zoomed', scale > fitScale + 0.001);
    updateButtons();
  }

  function updateButtons() {
    const has = index >= 0;
    ['btnZoomOut','btnZoomIn','btnFit','btnRotate','btnDownload'].forEach(id => { $(id).disabled = !has; });
  }

  function zoom(factor) {
    if (!imgEl) return;
    scale = Math.min(Math.max(scale * factor, fitScale * 0.5), fitScale * 8);
    applyTransform();
  }

  // Controls
  $('btnZoomIn').addEventListener('click', () => zoom(1.25));
  $('btnZoomOut').addEventListener('click', () => zoom(0.8));
  $('btnFit').addEventListener('click', fitToWindow);
  $('btnRotate').addEventListener('click', () => { rotation = (rotation + 90) % 360; fitToWindow(); });
  $('btnDownload').addEventListener('click', () => {
    if (index < 0) return;
    const a = document.createElement('a'); a.href = items[index].url; a.download = items[index].name; a.click();
  });
  $('btnOpen').addEventListener('click', () => fileInput.click());
  $('emptyOpen').addEventListener('click', () => fileInput.click());
  $('navPrev').addEventListener('click', () => show((index - 1 + items.length) % items.length));
  $('navNext').addEventListener('click', () => show((index + 1) % items.length));
  fileInput.addEventListener('change', e => { loadFiles(e.target.files); fileInput.value = ''; });

  // Wheel zoom
  stage.addEventListener('wheel', e => { if (!imgEl) return; e.preventDefault(); zoom(e.deltaY < 0 ? 1.1 : 0.9); }, { passive: false });

  // Pan when zoomed
  let dragging = false, sx = 0, sy = 0, spx = 0, spy = 0;
  stage.addEventListener('pointerdown', e => {
    if (!imgEl || scale <= fitScale + 0.001) return;
    dragging = true; sx = e.clientX; sy = e.clientY; spx = panX; spy = panY;
    stage.classList.add('panning'); stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return; panX = spx + (e.clientX - sx); panY = spy + (e.clientY - sy); applyTransform();
  });
  const endPan = () => { dragging = false; stage.classList.remove('panning'); };
  stage.addEventListener('pointerup', endPan);
  stage.addEventListener('pointercancel', endPan);

  // Keyboard
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' && items.length > 1) show((index + 1) % items.length);
    else if (e.key === 'ArrowLeft' && items.length > 1) show((index - 1 + items.length) % items.length);
    else if (e.key === '+' || e.key === '=') zoom(1.25);
    else if (e.key === '-') zoom(0.8);
    else if (e.key === '0') fitToWindow();
  });

  // Drag & drop
  let dragDepth = 0;
  window.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) document.body.classList.remove('dragging'); });
  window.addEventListener('drop', e => {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    if (e.dataTransfer && e.dataTransfer.files.length) loadFiles(e.dataTransfer.files);
  });

  window.addEventListener('resize', () => { if (imgEl) fitToWindow(); });
  window.addEventListener('beforeunload', revokeAll);
  updateButtons();

  // Open a file handed over by the desktop shell (from the Files app), loaded from the
  // backend via /api/system/files/raw (range-capable, correct MIME). Same-origin only.
  function loadFromBackend(path, name) {
    revokeAll();
    const url = `/api/system/files/raw?path=${encodeURIComponent(path)}&name=${encodeURIComponent(name)}`;
    items = [{ url, name }];
    index = 0;
    buildFilmstrip();
    show(0);
  }
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin) return;
    const d = e.data || {};
    if (d.type === 'open-file-in-picture' && typeof d.path === 'string' && typeof d.name === 'string') {
      loadFromBackend(d.path, d.name);
    }
  });
  // Tell the shell we're ready to receive a file (mirrors the Notes handshake).
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'picture-ready' }, location.origin);
  }
</script>
</body>
</html>
