<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/desktop/assets/i18n-data.js"></script>
    <script src="/desktop/assets/i18n.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/desktop/assets/fonts/fonts.css" rel="stylesheet">
    <link href="/desktop/assets/setup.css" rel="stylesheet">
    <title data-i18n="setup.title">mariowOS Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        .setup-content.highlights {
            width: min(100%, 1040px);
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr);
            align-items: center;
            gap: 28px;
        }

        .highlight-view { display: flex; flex-direction: column; gap: 20px; }

        /* Same frame and motion as the screenshots on the welcome screen */
        .highlight-media {
            position: relative;
            width: min(100%, max(320px, calc((100dvh - 370px) * 16 / 9)));
            aspect-ratio: 16 / 9;
        }

        .highlight-media img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 255, 255, 0.15);
            opacity: 0;
            transform: scale(0.92);
            transition: opacity 0.6s ease, transform 0.9s var(--setup-glide);
        }

        .highlight-media img.show { opacity: 1; transform: scale(1); }

        .highlight-tabs { display: flex; flex-direction: column; gap: 12px; }

        .highlight-tab {
            background: rgba(24, 24, 28, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            padding: 16px 18px;
            color: #fff;
            text-align: left;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.3;
            cursor: pointer;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }

        .highlight-tab:hover { border-color: rgba(255, 255, 255, 0.4); }
        .highlight-tab[aria-selected="true"] { background: #fff; color: #000; border-color: #fff; }
        .highlight-tab:focus-visible { outline: 2px solid var(--setup-accent); outline-offset: 3px; }

        .highlight-text {
            display: none;
            font-size: 1rem;
            line-height: 1.5;
            color: #fff;
            text-shadow: 0 0 6px #000, 0 0 12px #000;
        }

        .highlight-text.show { display: block; }

        @media (max-width: 760px) {
            .setup-content.highlights { grid-template-columns: minmax(0, 1fr); gap: 20px; }
            .highlight-tabs { flex-direction: row; flex-wrap: wrap; gap: 8px; }
            .highlight-tab { flex: 1 1 30%; padding: 12px; font-size: 0.85rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .highlight-media img { transition: none; }
        }
    </style>
</head>
<body class="setup-page" data-step="5">

    <h1 class="setup-title" data-words="Highlights|Novità|Noutăți|亮点">Highlights</h1>

    <main class="setup-stage">
        <div class="setup-content highlights">
            <div class="highlight-tabs" role="tablist">
                <button class="highlight-tab" role="tab" type="button" aria-selected="true" data-i18n="setup.highlights.desktop">A new desktop</button>
                <button class="highlight-tab" role="tab" type="button" aria-selected="false" data-i18n="setup.highlights.store">The Store</button>
                <button class="highlight-tab" role="tab" type="button" aria-selected="false" data-i18n="setup.highlights.music">Music</button>
                <!-- Placeholder sections: change the name here, the picture and text below, and the setup.highlights.extra-* keys in it.json. -->
                <button class="highlight-tab" role="tab" type="button" aria-selected="false" data-i18n="setup.highlights.extra-1">Section four</button>
                <button class="highlight-tab" role="tab" type="button" aria-selected="false" data-i18n="setup.highlights.extra-2">Section five</button>
            </div>

            <div class="highlight-view" role="tabpanel" aria-live="polite">
                <div class="highlight-media">
                    <img class="show" id="picture-desktop" src="/desktop/assets/newmwos.png" alt="">
                    <img id="picture-store" src="/desktop/assets/highlight-store.jpg" alt="">
                    <img id="picture-music" src="/desktop/assets/highlight-music.jpg" alt="">
                    <img id="picture-extra-1" src="/desktop/assets/highlight-placeholder.svg" alt="">
                    <img id="picture-extra-2" src="/desktop/assets/highlight-placeholder.svg" alt="">
                </div>
                <p class="highlight-text show" data-i18n="setup.highlights.desktop-text">mariowOS has been completely reimagined.</p>
                <p class="highlight-text" data-i18n="setup.highlights.store-text">Install and remove apps, and read each app's terms first.</p>
                <p class="highlight-text" data-i18n="setup.highlights.music-text">Radio, your own files, Spotify, Last.fm and Audius in one app.</p>
                <p class="highlight-text" data-i18n="setup.highlights.extra-1-text">Description of section four.</p>
                <p class="highlight-text" data-i18n="setup.highlights.extra-2-text">Description of section five.</p>
            </div>
        </div>
    </main>

    <a href="lastpart.html" class="setup-next" aria-label="Next" data-i18n-aria-label="setup.next">
        <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
    </a>

    <script src="/desktop/assets/setup.js"></script>
    <script>
        document.getElementById('picture-desktop').alt = mariowOSI18n.t("setup.highlights.desktop-alt", "The new mariowOS desktop");
        document.getElementById('picture-store').alt = mariowOSI18n.t("setup.highlights.store-alt", "The Store showing apps ready to install");
        document.getElementById('picture-music').alt = mariowOSI18n.t("setup.highlights.music-alt", "The Music app showing a list of radio stations");
        document.getElementById('picture-extra-1').alt = mariowOSI18n.t("setup.highlights.extra-1-alt", "Picture of section four");
        document.getElementById('picture-extra-2').alt = mariowOSI18n.t("setup.highlights.extra-2-alt", "Picture of section five");

        const pictures = [...document.querySelectorAll('.highlight-media img')];
        const descriptions = [...document.querySelectorAll('.highlight-text')];
        const tabs = [...document.querySelectorAll('.highlight-tab')];
        const content = document.querySelector('.highlights');
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        let current = 0;

        function showHighlight(index) {
            current = index;
            pictures.forEach((picture, i) => picture.classList.toggle('show', i === index));
            descriptions.forEach((description, i) => description.classList.toggle('show', i === index));
            tabs.forEach((tab, i) => tab.setAttribute('aria-selected', String(i === index)));
        }

        tabs.forEach((tab, index) => tab.addEventListener('click', () => showHighlight(index)));

        // Moves on by itself, unless the user is looking at one.
        if (!reducedMotion) {
            setInterval(() => {
                if (!content.matches(':hover') && !content.matches(':focus-within')) showHighlight((current + 1) % tabs.length);
            }, 5000);
        }
    </script>
</body>
</html>
