<!DOCTYPE html>
<html lang="en">
<head>
<script src="/desktop/assets/i18n-data.js"></script>
<script src="/desktop/assets/i18n.js"></script>
<script src="/desktop/assets/mariowos-dialogs.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/desktop/assets/fonts/fonts.css" rel="stylesheet">
    <link href="/desktop/assets/setup.css" rel="stylesheet">
    <title data-i18n="setup.password.title">mariowOS - User Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        .user-card { display: flex; flex-direction: column; align-items: center; }

        /* Avatar Picker */
        .user-icon {
            width: 90px;
            height: 90px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            color: #fff;
            transition: transform 0.2s;
        }

        .user-icon:hover { transform: scale(1.05); }
        .user-icon img { width: 100%; height: 100%; object-fit: cover; }

        .edit-overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            font-size: 10px;
            font-weight: 600;
            text-align: center;
            padding: 4px 0;
            letter-spacing: 1px;
        }

        #passwordForm { width: 100%; }
        .input-wrapper { width: 100%; margin-bottom: 16px; }
        .input-wrapper:last-child { margin-bottom: 0; }
        .input-label { font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; display: block; color: rgba(255,255,255,0.7); }

        input {
            width: 100%;
            padding: 12px 16px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.3); }
        input:focus { background-color: rgba(0, 0, 0, 0.5); border-color: var(--setup-accent); box-shadow: 0 0 0 1px var(--setup-accent); }

        .hidden { display: none; }
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="setup-page" data-step="2">

    <h1 class="setup-title" data-words="User|Utente|Utilizator|用户">User</h1>

    <main class="setup-stage">
        <div class="setup-content">
            <div class="setup-panel user-card">
                <button type="button" class="user-icon" onclick="document.getElementById('avatarInput').click()">
                    <img id="avatarPreview" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23fff'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E">
                    <div class="edit-overlay">ADD</div>
                </button>
                <input type="file" id="avatarInput" accept="image/png, image/jpeg" style="display:none" onchange="uploadAvatar(event)">

                <form id="passwordForm">
                    <div class="input-wrapper">
                        <label class="input-label" for="usernameInput" data-i18n="setup.password.username">Username</label>
                        <input type="text" id="usernameInput" autocomplete="username" placeholder="Enter username" data-i18n-placeholder="setup.password.username-placeholder" required>
                    </div>
                    <div class="input-wrapper">
                        <label class="input-label" for="passwordInput" data-i18n="setup.password.password">Enter password</label>
                        <input type="password" id="passwordInput" autocomplete="new-password" placeholder="••••••••" required>
                    </div>
                    <div class="input-wrapper">
                        <label class="input-label" for="confirmInput" data-i18n="setup.password.repeat">Repeat password</label>
                        <input type="password" id="confirmInput" autocomplete="new-password" placeholder="••••••••" required>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <button id="nextBtn" class="setup-next" type="button" aria-disabled="true" aria-label="Next" data-i18n-aria-label="setup.next">
        <svg id="arrow-icon" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        <svg id="spinner" class="hidden animate-spin" viewBox="0 0 24 24" style="fill:none; stroke:currentColor; stroke-width:3;">
            <circle cx="12" cy="12" r="10" style="opacity:0.25;"></circle>
            <path d="M4 12a8 8 0 018-8" style="opacity:0.75;"></path>
        </svg>
    </button>

    <script src="/desktop/assets/setup.js"></script>
    <script>
        document.querySelector('.edit-overlay').textContent = mariowOSI18n.t("setup.password.avatar-add", "ADD");

        // Avatar Upload Logic
        function uploadAvatar(e) {
            const file = e.target.files[0];
            if (!file) return;
            const fd = new FormData();
            fd.append('avatar', file);
            fetch('/upload-avatar', { method: 'POST', body: fd })
                .then(r => r.json())
                .then(res => {
                    if (res.success) {
                        document.getElementById('avatarPreview').src = `/desktop/assets/avatar.user.png?t=${Date.now()}`;
                        document.querySelector('.edit-overlay').innerText = mariowOSI18n.t("setup.password.avatar-edit", "EDIT");
                    }
                });
        }

        const usernameInput = document.getElementById("usernameInput");
        const passwordInput = document.getElementById("passwordInput");
        const confirmInput = document.getElementById("confirmInput");
        const nextBtn = document.getElementById("nextBtn");
        const arrowIcon = document.getElementById("arrow-icon");
        const spinner = document.getElementById("spinner");

        const isReady = () => nextBtn.getAttribute("aria-disabled") === "false";

        function updateButtonState() {
            const ready = usernameInput.value.trim().length > 0 &&
                passwordInput.value.length > 0 &&
                confirmInput.value.length > 0;
            nextBtn.setAttribute("aria-disabled", String(!ready));
        }

        [usernameInput, passwordInput, confirmInput].forEach(input => {
            input.addEventListener("input", updateButtonState);
        });

        // Enter in any field acts as the arrow instead of reloading the page.
        document.getElementById("passwordForm").addEventListener("submit", event => {
            event.preventDefault();
            nextBtn.click();
        });

        nextBtn.addEventListener("click", async () => {
            if (!isReady()) return;

            const pass = passwordInput.value;
            const confirm = confirmInput.value;

            if (pass !== confirm) {
                await mDialog.alert(mariowOSI18n.t("setup.password.mismatch", "Passwords do not match!"));
                return;
            }

            nextBtn.setAttribute("aria-disabled", "true");
            arrowIcon.classList.add("hidden");
            spinner.classList.remove("hidden");

            try {
                const res = await fetch("/set-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams({
                        username: usernameInput.value,
                        newPassword: pass
                    })
                });

                const text = await res.text();
                // Bug fix: The backend actually sends "Configurazione completata!" not a checkmark.
                if (res.ok && text.includes("Configurazione completata!")) {
                    MWSetup.go("/desktop/preferences.html");
                } else {
                    await mDialog.alert(text);
                }
            } catch (err) {
                await mDialog.alert(mariowOSI18n.t("setup.connection-error", "Connection error: {error}", { error: err.message }));
            } finally {
                spinner.classList.add("hidden");
                arrowIcon.classList.remove("hidden");
                updateButtonState();
            }
        });
    </script>
</body>
</html>
