# Runs the kernel tests (test/*.test.js) on every pull request and push to main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install kernel dependencies
        run: npm ci --omit=dev
      - name: Run tests
        run: npm test
